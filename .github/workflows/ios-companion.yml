name: iOS Companion

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "services/sync-gateway/**"
      - "server/mobile-sync/**"
      - ".github/workflows/ios-companion.yml"
  workflow_dispatch:

jobs:
  ios-simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xinyun/mobile typecheck
      - run: pnpm dlx expo-doctor@latest apps/mobile
      - run: pnpm --filter @xinyun/mobile exec expo export --platform ios --output-dir dist-ios
      - name: Generate native iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --repo-update
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
